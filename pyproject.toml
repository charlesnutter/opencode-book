[project]
name = "opencode-book"
version = "0.1.0"
description = "Build a book from opencode's documentation, with grounded sources."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
opencode-book = "opencode_book.cli:main"
# Short alias for typing convenience -- delete if you want a single name.
obook = "opencode_book.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# corpus/, prompts/, chapters/ and voice/ are book content, not Python
# packages -- name the one real package so auto-discovery doesn't claim them.
# Underscored because Python imports cannot contain hyphens; the distribution
# and CLI are both spelled opencode-book.
[tool.setuptools]
packages = ["opencode_book"]
