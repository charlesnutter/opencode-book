id: rules-and-context
title: Teaching the Agent Your Codebase
target_words: 2000

objectives:
  - Make the case for rules files as accumulated, hard-won project knowledge
  - Show initialization and where rules files are picked up
  - Cover external file loading for larger rule sets
  - Walk through rules for a monorepo, where conventions matter most

